<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session — Calcul/Mental</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --page-bg: #E4E3DD;
    --ink: #17171A;
    --ink-soft: #6B6B66;
    --line: rgba(0,0,0,0.10);
    --panel: #EFEEE7;
    --accent: #3E6FD9;
    --correct: #4E8B63;
    --incorrect: #C1583B;
    --font: 'Archivo', sans-serif;
    --r: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--page-bg);
    font-family: var(--font);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: 20px;
  }

  /* Top bar: progress + quit */
  .top-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 8px;
  }
  .quit-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: #fff;
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .progress-track {
    flex: 1;
    height: 8px;
    background: #fff;
    border-radius: 20px;
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .progress-fill {
    width: 42%;
    height: 100%;
    background: var(--accent);
    border-radius: 20px;
  }
  .progress-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  /* Timer ring */
  .timer-wrap {
    display: flex;
    justify-content: center;
    margin: 6px 0 18px;
  }
  .timer-ring {
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 4px solid var(--panel);
    border-top-color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    font-weight: 700;
  }

  /* Question center */
  .center {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
  }
  .question {
    font-weight: 800;
    font-size: clamp(48px, 9vw, 88px);
    letter-spacing: -0.01em;
    text-align: center;
  }
  .answer-display {
    background: #fff;
    border: 2px solid var(--line);
    border-radius: var(--r);
    padding: 18px 36px;
    font-size: 34px;
    font-weight: 700;
    min-width: 180px;
    text-align: center;
    color: var(--ink-soft);
  }
  .answer-display.filled { color: var(--ink); border-color: var(--accent); }

  /* Keypad */
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    max-width: 340px;
    margin: 0 auto;
    width: 100%;
  }
  .key {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 18px 0;
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
  }
  .key.wide { grid-column: span 1; }
  .key.action { background: var(--panel); font-size: 16px; }
  .key.validate { background: var(--ink); color: #fff; grid-column: span 1; }

  .footer-hint {
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 18px;
  }
</style>
</head>
<body>

  <div class="top-bar">
    <div class="quit-btn">✕</div>
    <div class="progress-track"><div class="progress-fill"></div></div>
    <div class="progress-label">9 / 20</div>
  </div>

  <div class="timer-wrap">
    <div class="timer-ring">7s</div>
  </div>

  <div class="center">
    <div class="question">37 + 15 = ?</div>
    <div class="answer-display filled">52</div>
  </div>

  <div class="keypad">
    <div class="key">1</div>
    <div class="key">2</div>
    <div class="key">3</div>
    <div class="key">4</div>
    <div class="key">5</div>
    <div class="key">6</div>
    <div class="key">7</div>
    <div class="key">8</div>
    <div class="key">9</div>
    <div class="key action">←</div>
    <div class="key">0</div>
    <div class="key validate">✓</div>
  </div>

  <div class="footer-hint">Entraînement libre · correction immédiate</div>

</body>
</html>
